# Deploy this repository through Render > New > Blueprint.
# These are PAID plans. Review Render's displayed charges before deployment.
services:
  - type: web
    name: salonflow-studio
    runtime: node
    region: virginia
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.22.0
      - key: DATABASE_URL
        fromDatabase:
          name: salonflow-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: salonflow-db
    databaseName: salonflow
    user: salonflow
    region: virginia
    plan: 0.1c-256mb
    diskSizeGB: 5
    ipAllowList: []
